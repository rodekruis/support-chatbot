name: deploy to prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'prod'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    outputs:
      webapp-url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.image_sha }}" ]; then
            echo "tag=${{ github.event.inputs.image_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Wait for image tag in registry
        shell: bash
        run: |
          IMAGE="${{ secrets.REGISTRY_USERNAME }}.azurecr.io/${{ github.event.repository.name }}:${{ steps.image.outputs.tag }}"
          echo "Waiting for image: $IMAGE"

          for i in {1..30}; do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image is available."
              exit 0
            fi

            echo "Image not available yet (attempt $i/30), waiting 20s..."
            sleep 20
          done

          echo "::error::Image $IMAGE was not found after waiting."
          exit 1

      - name: Deploy container image to Azure Web App (prod)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'support-chatbot'
          slot-name: 'prod'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io/${{ github.event.repository.name }}:${{ steps.image.outputs.tag }}

  smoke-test:
    # Post-deploy, non-blocking smoke test: calls the live prod service over HTTP
    # to confirm the just-deployed instance answers end-to-end (its own Azure /
    # Langfuse config is exercised server-side, so CI only needs one read key).
    # `continue-on-error` keeps a failure visible as a red check without blocking
    # the deploy that already ran.
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: 'prod'
    env:
      APP_URL: ${{ needs.deploy.outputs.webapp-url }}
      AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
    steps:
      - name: Wait for the service to be healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "${APP_URL}/health" > /dev/null; then
              echo "Service is healthy."
              exit 0
            fi
            echo "Attempt $i: service not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Service did not become healthy in time."
          exit 1

      - name: Ask a question end-to-end
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "${APP_URL}/ask" \
            -H "Authorization: ${AUTH_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"question": "How do I make a payment?", "manual_id": "121"}')
          echo "Response: ${response}"
          answer=$(printf '%s' "${response}" | jq -r '.answer // empty')
          if [ -z "${answer}" ]; then
            echo "::error::/ask returned an empty answer."
            exit 1
          fi
          echo "Received a non-empty answer from the live service."
